[project]
name = "plotly-extend-wrapper"
version = "1.5.0"
authors = [{ name = "Laplusdestiny", email = "prayonshootingstars@gmail.com" }]
dependencies = [
    "plotly>=6.1.0",
    "kaleido>=0.2.1",
    "pyarrow>=10.0.0",
    "pandas>=2.0.0",
    "scipy>=1.8.0",
    "numpy>=1.24.0",
    "nbformat>=4.2.0",
]
readme = "README.md"
requires-python = ">= 3.9"

[project.optional-dependencies]
polars = ["polars>=0.20.0"]

[dependency-groups]
dev = [
    "build>=1.4.0",
    "furo>=2025.12.19",
    "ipykernel>=6.31.0",
    "myst-parser>=3.0.1",
    "polars>=0.20.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "scikit-learn>=1.6.1",
    "sphinx>=7.4.7",
    "twine>=6.2.0",
    "wheel>=0.46.3",
]

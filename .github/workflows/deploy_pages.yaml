name: Deploy Sphinx documentation to Pages

# GitHub Pages is served from the root of the gh-pages branch.
# PR previews are stored in gh-pages/pr-preview/ (see docs_preview.yml),
# so this workflow must not remove that directory nor force-push.

on:
  push:
    branches: [main] # branch to trigger deployment
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Build Sphinx (warnings are treated as errors)
        run: uv run sphinx-build -W --keep-going -b html -d docs/_build/doctrees docs/ docs/_build/html
      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: docs/_build/html
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

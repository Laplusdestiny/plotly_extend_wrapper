name: Preview Sphinx documentation

# Build the documentation for each pull request and deploy it to
# https://laplusdestiny.github.io/plotly_extend_wrapper/pr-preview/pr-<number>/
# The preview is removed when the pull request is closed.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: docs-preview-${{ github.event.number }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # push the preview to the gh-pages branch
      pull-requests: write # comment the preview URL on the pull request
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        if: github.event.action != 'closed'
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        if: github.event.action != 'closed'
        run: uv sync
      - name: Build Sphinx (warnings are treated as errors)
        if: github.event.action != 'closed'
        run: uv run sphinx-build -W --keep-going -b html -d docs/_build/doctrees docs/ docs/_build/html
      # Pull requests from forks cannot push to this repository, so only the build is checked
      - name: Deploy / remove preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: docs/_build/html
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: false

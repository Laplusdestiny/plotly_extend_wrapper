name: Build Sphinx documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync
      - name: Build Sphinx (warnings are treated as errors)
        run: uv run sphinx-build -W --keep-going -b html docs/ docs/_build
